# Copy to /etc/heartwatch/config.toml (or ./config.toml for local runs) and adjust.

db_path = "/var/lib/heartwatch/heartwatch.db"
archive_dir = "/var/lib/heartwatch/archive"   # every imported file is copied here; back it up

# Dropbox: a read-only app you create (see README). Run `heartwatch dropbox-login` once.
dropbox_app_key = ""
dropbox_folder = "/Apps/WahooFitness"           # where the Wahoo app shares its .fit files
dropbox_token_file = "/var/lib/heartwatch/dropbox_token"
heartbeat_url = ""   # pinged when a poll finds a new workout; set the check's period to 7 days

# Nightly copy to the NAS: a shared folder (mounted only during the backup, with the account
# in /etc/heartwatch/nas-credentials), or else rsync over ssh with the key install.sh made.
backup_share = ""    # e.g. "//nas.local/heartwatch"
backup_target = ""   # e.g. "heartwatch@nas.local:/volume1/Backup/heartwatch"
backup_ssh_key = "/var/lib/heartwatch/.ssh/id_ed25519"

# Heart-rate reserve zones: zone 2 = 60-70% of the way from resting to max.
resting_hr = 60
max_hr = 180   # use the highest you've recorded; raise it if a workout goes higher

# Averaging windows, in days. Longer = smoother and slower to react.
fitness_days = 21      # fitness score: long-term load averaged again
aerobic_days = 60      # long-term load, zones 1-2
threshold_days = 35    # long-term load, zones 3-4
anaerobic_days = 18    # long-term load, zone 5
fatigue_days = 7       # short-term load

# Resting heart rate from the ring moves training capacity by up to this much either way; 0: off.
readiness_adjust_max = 12

# The phone's Health Connect app (HC Webhook) sends this in an X-HeartWatch-Key header. Make it
# long and random; empty turns the endpoint off.
healthconnect_key = ""
# Keep every payload the phone sends whole (heart rate, steps, SpO2... whatever the app is
# allowed to read) in the archive, for uses beyond HeartWatch. Off: only what HeartWatch uses.
healthconnect_keep_all = false

# Short-term load counts harder work extra.
threshold_fatigue = 1.4
anaerobic_fatigue = 2.0
